[project]
name = "xenovarients"
version = "0.1.0"
description = "Customer Genome · Creator Commerce · Agent Workspace"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn[standard]==0.40.0",
    "sqlalchemy[asyncio]==2.0.44",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.11",  # sync driver, used only by Alembic
    "alembic==1.17.1",
    "pydantic==2.13.1",
    "pydantic-settings==2.13.0",
    "email-validator==2.4.0",
    "redis==6.4.0",
    "httpx==0.28.1",
    "pyjwt==2.11.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.0",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.14.4",
    "mypy==1.18.2",
    "types-redis==4.6.0.20241004",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xenovarients*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented pattern

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Tests are checked for real type errors, not for annotated signatures. A pytest
# fixture's declared type is already expressed by its return annotation; demanding
# one on every parameter adds noise without catching anything.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires a live Postgres (tenant isolation, RLS, migrations)",
]
filterwarnings = ["error::DeprecationWarning:xenovarients.*"]

[tool.coverage.run]
source = ["xenovarients"]
